<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Disable native browser pinch-zoom so it can't move the fixed top nav;
         the viewer implements its own pinch-to-zoom of the PDF instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>NOW PDFer</title>
    <meta name="description" content="A fast, private PDF editor. Everything runs on your device." />
    <script type="module" crossorigin src="./assets/index-Dcw-Uzlb.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BelyfUlQ.css">
  </head>
  <body>
    <div id="root">
      <!-- Instant splash: visible the moment the webview paints, replaced when
           React mounts. Keeps a cold start from looking like a hung app. -->
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background: #f8fafc;
          color: #64748b;
          font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
          font-size: 14px;
        "
      >
        <div
          style="
            width: 28px;
            height: 28px;
            border: 3px solid #cbd5e1;
            border-top-color: #3b66f5;
            border-radius: 50%;
            animation: nowpdfer-spin 0.8s linear infinite;
          "
        ></div>
        Opening NOW PDFer…
      </div>
      <style>
        @keyframes nowpdfer-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
  </body>
</html>
